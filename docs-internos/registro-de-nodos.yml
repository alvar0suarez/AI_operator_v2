  conceptos: [causa-raiz, sistema, anomalia]
  estado: pendiente-piloto
  fuente_spec: "§3 bloque 4, contenido 4.2"
  brief: "Causa raíz sobre volumen real de tickets. Verdad escondida asociada: V1, el fallo de redondeo."

- id: b4-m3-contacto-evitable
  bloque: 4
  titulo: "Contacto evitable"
  tipo: concepto
  duracion_min: 50
  caduca: bajo
  requisitos: [b4-m2-causa-raiz]
  desbloquea: [b4-m4-coste-de-un-contacto]

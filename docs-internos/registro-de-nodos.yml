  fuente_spec: "§3 bloque 4, contenido 4.1"
  brief: "Cómo se construye una taxonomía y por qué la mayoría están mal. Verdad escondida asociada: la taxonomía sucia de tickets.xlsx."

- id: b4-m2-causa-raiz
  bloque: 4
  titulo: "Análisis de causa raíz"
  tipo: concepto
  duracion_min: 50
  caduca: bajo

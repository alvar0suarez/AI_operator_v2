  estado: pendiente-piloto
  fuente_spec: "§3 bloque 4, contenido 4.3"
  brief: "El concepto más rentable del sector: cada ticket que no debería haber existido."

- id: b4-m4-coste-de-un-contacto
  bloque: 4
  titulo: "El coste real de un contacto"
  tipo: concepto
  duracion_min: 45
  caduca: bajo
